<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PRCXV8GX56"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PRCXV8GX56');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Beflaz</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Canonical + Structured Data (for Google / Bing / IndexNow) -->
    <link rel="canonical" href="{{ARTICLE_URL}}">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "{{SCHEMA_TYPE}}",
      "headline": "{{HEADLINE_JSON}}",
      "image": ["{{IMAGE_URL}}"],
      "datePublished": "{{PUBLISH_ISO}}",
      "dateModified": "{{PUBLISH_ISO}}",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ARTICLE_URL}}"
      },
      "author": {
        "@type": "Organization",
        "name": "{{PUBLISHER_NAME_JSON}}",
        "url": "{{SITE_URL}}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "{{PUBLISHER_NAME_JSON}}",
        "logo": {
          "@type": "ImageObject",
          "url": "{{PUBLISHER_LOGO}}"
        }
      }
    }
    </script>

    <style>
        /* Article-specific basic styling for AI generated content */
        .article-body h2, .article-body h3, .article-body h4 {
            color: var(--gold-light);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .article-body p {
            margin-bottom: 1.5rem;
        }
        .article-body ul, .article-body ol {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }
        .article-body li {
            margin-bottom: 0.5rem;
        }
        .article-body a {
            color: var(--gold);
            text-decoration: underline;
        }
        .article-body a:hover {
            color: var(--silver-light);
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb gold"></div>
    <div class="bg-orb silver"></div>

    <!-- Header & Navigation -->
    <header class="site-header">
        <a href="../index.html" style="font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; letter-spacing: 0.05em;">
            Beflaz
        </a>
        <nav class="site-nav">
            <a href="../news.html">News</a>
            <a href="../jobs.html">Jobs</a>
            <a href="../scholarships.html">Scholarships</a>
            <a href="../dramas.html">Dramas</a>
            <a href="../health.html">Health</a>
            <a href="../history.html">History</a>
        </nav>
    </header>

    <!-- Main Article Container -->
    <main style="max-width: 800px; margin: 4rem auto; padding: 0 2rem;">
        <article class="fade-up">

            <h1 style="font-family: 'Playfair Display', serif; color: var(--gold-light); font-size: 2.8rem; line-height: 1.25; margin-bottom: 0.5rem;">
                {{TITLE}}
            </h1>

            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; font-style: italic;">
                Published on {{CURRENT_TIME}}
            </p>

            <div style="width: 100%; margin-bottom: 2.5rem; border-radius: 12px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 12px 24px rgba(0,0,0,0.3);">
                <img src="{{IMAGE_URL}}" alt="Article Image" style="width: 100%; max-height: 500px; object-fit: cover; display: block;">
            </div>

            <div class="article-body" style="font-size: 1.15rem; line-height: 1.8; color: var(--text-primary);">
                {{AI_CONTENT}}
            </div>

            <!-- Back to Category / Share Action -->
            <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(199, 203, 209, 0.1); text-align: center;">
                <a href="javascript:history.back()" class="btn-primary">← Back to Category</a>
            </div>

        </article>
    </main>

   <footer class="site-footer fade-up" style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
        
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2rem; margin-bottom: 2rem;">
            
            <div class="footer-links" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <h3 style="color: var(--accent); margin-bottom: 10px;">Quick Links</h3>
                <a href="about.html" style="text-decoration: none;">About Us</a>
                <a href="contact.html" style="text-decoration: none;">Contact</a>
                <a href="privacy-policy.html" style="text-decoration: none;">Privacy Policy</a>
                <a href="editorial-policy.html" style="text-decoration: none;">Editorial Policy</a>
            </div>

            <div class="newsletter-box">
                <iframe src="https://beflaz.substack.com/embed?transparent=1&light=90" width="480" height="320" style="border: 0; filter: invert(1) hue-rotate(180deg) contrast(0.9);" frameborder="0" scrolling="no"></iframe>
            </div>

        </div>

        <div style="text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.5rem;">
            <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0;">&copy; 2026 Beflaz. All rights reserved.</p>
        </div>
        
    </footer>

    <!-- Scroll Reveal Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.fade-up').forEach((el) => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
